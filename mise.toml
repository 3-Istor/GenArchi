# Outils pour Ubuntu (et toute machine sans Nix). Mêmes versions que flake.nix (nixos-26.05).
# Installation : scripts/bootstrap-ubuntu.sh, puis `mise install`.
[tools]
opentofu = "1.11.14"
python = "3.13"
uv = "0.11"
tflint = "0.61.0"
k6 = "2.0.0"
shellcheck = "0.11.0"
jq = "1.8"
"pipx:ansible-core" = "2.21"
gcloud = "565.0.0"

[settings]
pipx.uvx = true
