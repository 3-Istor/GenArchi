[defaults]
inventory = inventory/generated.yml
roles_path = roles
interpreter_python = /usr/bin/python3
forks = 20
stdout_callback = ansible.builtin.default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
# ssh_config est généré par `make p2-inventory` (bastion joint par IAP, OS Login).
ssh_args = -F ssh_config -o ControlMaster=auto -o ControlPersist=120s
pipelining = true
