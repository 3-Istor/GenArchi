[project]
name = "genarchi"
version = "0.2.0"
description = "Billetterie GenArchi : la même application sur Platform 2 et Platform 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
# Platform 2 : PostgreSQL + RabbitMQ
p2 = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "pika>=1.3,<2"]
# Platform 3 : services Google managés
p3 = ["google-cloud-firestore>=2.19,<3", "google-cloud-storage>=2.18,<4", "google-cloud-pubsub>=2.23,<3"]

[project.scripts]
genarchi = "genarchi.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6", "openapi-core>=0.19,<1", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genarchi"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs PostgreSQL (TEST_DATABASE_URL)",
  "firestore: needs the Firestore emulator (FIRESTORE_EMULATOR_HOST)",
  "rabbitmq: needs RabbitMQ (TEST_AMQP_URL)",
]
